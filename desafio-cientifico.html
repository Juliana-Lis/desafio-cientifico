const E=Q("Ética e integridade","Um pesquisador descobre que os resultados reais não confirmam sua hipótese e decide ajustar alguns valores para que o estudo ‘dê certo’. Qual é o problema e a conduta correta?",[
["Falsificação de dados: alterar resultados reais compromete a verdade científica. A conduta correta é relatar os resultados obtidos, mesmo que não confirmem a hipótese.",1,"Falsificação distorce evidências, pode induzir a práticas clínicas equivocadas e é grave infração de integridade. Resultados negativos também têm valor científico."],
["Fabricação de dados, e a conduta correta é apenas revisar a redação.",.3,"Aproximou-se: na fabricação os dados são inventados; aqui dados reais foram modificados (falsificação). Revisar a redação não resolve o problema."],
["Viés de seleção; a conduta correta é ampliar a amostra até que a hipótese se confirme.",.1,"Continuar coletando até obter o resultado desejado também é manipulação. A hipótese pode ser refutada: isso também é conhecimento."]]);
const E2=Q("Ética e integridade","Um artigo publica fotografias de pacientes identificáveis, sem autorização, e inclui como coautor um chefe que não participou do trabalho. Quais princípios foram violados?",[
["Confidencialidade/consentimento (TCLE) dos participantes e autoria científica indevida (autoria honorária).",1,"Participantes têm direito à autonomia, ao sigilo e à proteção de dados; só quem contribuiu substancialmente deve constar como autor. Consequências: danos aos participantes, retratação do artigo e sanções."],
["Apenas a questão da autoria; imagens de pacientes podem ser usadas se forem para ciência.",.3,"Finalidade científica não dispensa o consentimento. A imagem de paciente exige autorização adequada e proteção da identidade."],
["Conflito de interesses, resolvido retirando as imagens e mantendo o coautor.",.2,"Não é o problema central. Há quebra de confidencialidade/autonomia e autoria indevida, e manter o coautor perpetua a irregularidade."]]);
const E3=Q("Ética e integridade","Uma pesquisa foi financiada por empresa fabricante do produto avaliado, e isso não consta no artigo. Qual é a conduta correta?",[
["Declarar o conflito de interesses e o financiamento, garantindo transparência ao leitor; submeter o projeto ao Comitê de Ética (CEP) quando envolver seres humanos.",1,"Conflito de interesses não proíbe a pesquisa, mas deve ser declarado para que o leitor avalie possíveis vieses. Em pesquisa com humanos, o CEP e o TCLE são indispensáveis; com animais, aplicam-se os 3Rs (substituição, redução e refinamento)."],
["Declarar o financiamento apenas se a empresa exigir, pois o contrato é confidencial.",.1,"A declaração é dever do pesquisador, independentemente de exigência; omitir compromete a credibilidade."],
["Recusar qualquer financiamento privado.",.4,"Financiamento privado é legítimo. O que a integridade científica exige é transparência."]]);
const D={
fisio:{n:"Fisioterapia",st:[
{t:"Problema e objetivo",ic:"❓",i:"Um hospital regional observou que muitos idosos têm dificuldade de recuperar a independência funcional após internação prolongada: fraqueza muscular, dificuldade de locomoção, alteração de equilíbrio e dependência nas atividades diárias. A equipe quer investigar fatores associados à recuperação funcional após a alta.",q:[
Q("Problema de pesquisa","Qual é o problema central?",[["Dificuldade de recuperação da independência funcional de idosos após internação prolongada.",1,"Identificou o problema real: uma lacuna observável e delimitada na população de interesse."],["Elevada taxa de reinternação de idosos no hospital regional.",.2,"É um indicador assistencial plausível, mas não é o fenômeno descrito: a dificuldade de recuperar a independência funcional."],["Baixa adesão dos idosos à fisioterapia após a alta.",.3,"Pode ser um fator associado, mas é hipótese; o problema observado é a dificuldade de recuperação funcional."]]),
Q("Pergunta de pesquisa","Qual pergunta representa melhor o problema?",[["Quais fatores estão associados à recuperação funcional de idosos nos três meses após a alta hospitalar?",1,"Pergunta delimitada (população, desfecho, tempo) e que pode ser respondida com dados."],["A fisioterapia é boa para idosos?",.2,"Ampla e vaga: não define população, intervenção, desfecho nem tempo. Gera estudos sem foco."],["Idosos internados por mais de sete dias recuperam-se pior do que os demais?",.5,"Boa pergunta, porém restrita a um único fator (tempo de internação), enquanto o objetivo é investigar fatores associados."]]),
Q("Objetivo geral","Qual objetivo geral é coerente?",[["Analisar fatores associados à recuperação da capacidade funcional de idosos após alta hospitalar.",1,"Começa com verbo no infinitivo, é mensurável e responde à pergunta."],["Implantar um programa de reabilitação para idosos após a alta.",.2,"É uma ação de intervenção, não um objetivo de investigação; a pesquisa busca analisar fatores associados."],["Comparar a recuperação funcional de idosos que fizeram fisioterapia com a dos que não fizeram.",.4,"Exigiria grupos comparados e possível intervenção; o estudo é observacional, voltado a fatores associados."]])]},
{t:"Classificação e delineamento",ic:"🧭",i:"Classifique a pesquisa e escolha o delineamento. Lembre-se: o delineamento depende da pergunta de pesquisa. Transversal: observa em um único momento; coorte: acompanha grupos ao longo do tempo; caso-controle: compara quem tem e quem não tem o desfecho; ensaio clínico: o pesquisador aplica e compara intervenções; estudo de caso: aprofunda poucos casos.",q:[
Q("Classificação","Pesquisa sobre fatores associados à recuperação funcional, com dados numéricos de escalas e testes, coletados em campo, sem intervenção do pesquisador. Como classificá-la?",[["Aplicada, quantitativa, observacional e de campo.",1,"Gera conhecimento para a prática clínica (aplicada), usa dados numéricos (quantitativa), apenas observa (observacional) e coleta com pacientes (campo)."],["Básica, qualitativa, experimental e bibliográfica.",0,"Nenhuma das características corresponde: há coleta numérica com pacientes e sem intervenção."],["Aplicada, quantitativa, experimental e documental.",.3,"Se não há intervenção do pesquisador, não é experimental; e a coleta é de campo, não apenas em documentos."]]),
Q("Delineamento","Para ‘acompanhar a recuperação funcional durante três meses’, qual delineamento é mais adequado?",[["Estudo de coorte.",1,"Segue os participantes ao longo do tempo e permite observar a evolução e os fatores associados. Outro delineamento só seria válido se a pergunta mudasse."],["Estudo transversal.",.3,"Avalia um único momento e não mostra a evolução. Seria adequado para ‘avaliar a capacidade funcional em um único momento’."],["Ensaio clínico.",.3,"Exigiria comparar intervenções aplicadas pelo pesquisador (por exemplo, dois protocolos fisioterapêuticos), o que não é o foco aqui."]],1)]},
{t:"População e amostra",ic:"👥",i:"População-alvo: o grupo ao qual queremos generalizar. População acessível: a parte dela a que temos acesso. Amostra: subconjunto efetivamente estudado. Amostragem probabilística (aleatória simples, sistemática, estratificada) dá a todos chance conhecida de seleção; a não probabilística (conveniência) não. Critérios de inclusão e exclusão delimitam quem participa.",q:[
Q("População","Qual população e amostra são mais adequadas?",[["População: idosos internados no hospital regional; amostra: idosos selecionados entre os que tiveram alta no período do estudo.",1,"A amostra é parte da população acessível e está de acordo com o problema."],["Toda a população idosa do país, avaliada em uma única visita.",.1,"População-alvo inacessível e sem relação com o hospital; inviável."],["Apenas os idosos mais saudáveis, para facilitar a coleta.",0,"Seleção enviesada: exclui justamente quem tem maior dificuldade de recuperação."]]),
Q("Amostragem","Qual estratégia de amostragem permite maior representatividade?",[["Aleatória simples ou estratificada por faixa etária, a partir da lista de altas.",1,"Probabilística: todos têm chance conhecida de seleção e há menos viés. Conveniência é válida em estudos exploratórios, se bem justificada."],["Convidar apenas os idosos que passarem pelo ambulatório naquela semana.",.4,"Amostragem por conveniência: é prática, mas limita a generalização dos resultados."],["Escolher os pacientes que o pesquisador conhece.",0,"Seleção intencional sem critério gera viés."]]),
Q("Critérios de inclusão e exclusão","Quais critérios são adequados?",[["Incluir: idosos (≥ 60 anos) com internação prolongada que aceitem participar (TCLE). Excluir: déficit cognitivo grave que impeça avaliação ou incapacidade prévia total.",1,"Definem claramente quem entra e quem sai, com justificativa metodológica e ética."],["Incluir qualquer pessoa internada; sem critérios de exclusão.",0,"Sem critérios a amostra é heterogênea e a comparação perde sentido."],["Excluir idosos que forem pior avaliados nos testes.",0,"Exclusão baseada no resultado é viés de seleção."]])]},
{t:"Variáveis",ic:"📊",i:"Qualitativas: categorias (nominais ou ordinais). Quantitativas: números (discretas ou contínuas). Independente (explicativa): o que se supõe influenciar; dependente (desfecho): o que se mede como resposta.",q:[
Q("Variáveis","Classifique ‘tempo de internação (em dias)’.",[["Quantitativa; independente (fator associado).",1,"É numérica, e se supõe que influencie a recuperação."],["Qualitativa; dependente.",0,"Dias são numéricos, e não o desfecho."],["Quantitativa; dependente.",.4,"Quantitativa, sim; mas o desfecho aqui é a independência funcional."]]),
Q("Variáveis","Qual a classificação de ‘independência funcional (escala com classes: dependente total, moderada, independente)’?",[["Qualitativa ordinal; dependente (desfecho).",1,"Tem categorias ordenadas e é o desfecho investigado. Se o escore da escala fosse numérico, seria quantitativa."],["Qualitativa nominal; independente.",.3,"As categorias têm ordem (ordinal), e é o desfecho."],["Quantitativa contínua; independente.",0,"Categorias não são medidas contínuas."]])]},
{t:"Instrumentos de coleta",ic:"📋",i:"Variável é o que se mede; instrumento é o meio de coleta; método de avaliação é como se mede; dado é o resultado obtido. A escolha deve ser compatível com a variável.",q:[
Q("Instrumentos","Para a variável ‘força muscular’ (de preensão), qual instrumento é mais adequado?",[["Dinamometria.",1,"Mede objetivamente a força, em kgf."],["Questionário sobre o que o idoso acha da sua força.",.3,"Mede percepção, e não a força em si."],["Prontuário de internação.",0,"Pode trazer informações, mas não mede força."]]),
Q("Instrumentos","Para ‘independência nas atividades de vida diária’ e ‘mobilidade’, quais instrumentos são adequados?",[["Escala de Barthel e Timed Up and Go (TUG).",1,"Barthel avalia independência em atividades diárias e o TUG avalia mobilidade e equilíbrio funcional."],["Apenas dinamometria.",.1,"Avalia força, e não independência ou mobilidade."],["Apenas o prontuário.",.2,"Pode servir como fonte complementar, mas não avalia o desempenho atual."]])]},
{t:"Ética e integridade",ic:"⚖️",i:"Princípios: autonomia, beneficência, não maleficência e justiça. Pesquisa com humanos exige TCLE, confidencialidade, proteção de dados e aprovação por Comitê de Ética em Pesquisa. Integridade: não fabricar nem falsificar dados, não plagiar, atribuir autoria corretamente, declarar conflitos de interesses e citar as fontes.",q:[E,E2,E3]}]},
bio:{n:"Biomedicina",st:[

Q("Problema de pesquisa","Qual é o problema central?",[["Resultados discordantes entre métodos diagnósticos de dengue, com testes rápidos negativos em pacientes depois confirmados.",1,"Identificou o fenômeno observado: discordância entre métodos."],["Demora na liberação dos resultados do RT-PCR.",.2,"É um problema logístico real, mas não o fenômeno investigado: a discordância entre métodos."],["Os pacientes procuram atendimento tarde.",.2,"Pode influenciar, mas é um fator associado, e não o problema central."]]),
Q("Pergunta de pesquisa","Qual pergunta representa melhor o problema?",[["Qual o desempenho do teste rápido, comparado à sorologia e ao RT-PCR, segundo os dias desde o início dos sintomas?",1,"Delimitada: métodos, comparação e variável de interesse (tempo)."],["O teste rápido funciona?",.2,"Vaga: não define o critério de desempenho, o padrão de comparação nem a população."],["Qual a prevalência de dengue entre os pacientes atendidos no laboratório?",.2,"Pergunta descritiva válida, mas não aborda o desempenho dos métodos."]]),
Q("Objetivo geral","Qual objetivo geral é coerente?",[["Avaliar o desempenho de métodos laboratoriais no diagnóstico da dengue segundo o tempo de evolução dos sintomas.",1,"Verbo mensurável, e objeto delimitado."],["Determinar a sensibilidade do teste rápido em pacientes com mais de cinco dias de sintomas.",.5,"Recorte válido, mas restrito a um método e a uma fase; o problema pede comparar métodos ao longo da evolução."],["Descrever o perfil epidemiológico dos pacientes com dengue atendidos no laboratório.",.2,"Objetivo descritivo viável, mas não responde sobre o desempenho dos métodos."]])]},
{t:"Classificação e delineamento",ic:"🧭",i:"Classifique a pesquisa e escolha o delineamento. Transversal: observa em um único momento; coorte: acompanha ao longo do tempo; caso-controle: compara quem tem e quem não tem o desfecho; ensaio clínico: o pesquisador aplica e compara intervenções; estudo de caso: aprofunda poucos casos. O delineamento depende da pergunta.",q:[
Q("Classificação","Pesquisa que compara resultados de testes em pacientes atendidos, com dados numéricos e categóricos, sem intervenção. Como classificá-la?",[["Aplicada, quantitativa, observacional e de campo.",1,"Gera conhecimento para o diagnóstico, usa dados quantificáveis e não intervém."],["Básica, qualitativa, experimental e bibliográfica.",0,"Não há intervenção nem apenas revisão de literatura."],["Aplicada, quantitativa, experimental e de campo.",.3,"Não há intervenção do pesquisador: é observacional."]]),
Q("Delineamento","Para ‘comparar resultados de métodos diagnósticos em um período específico’, qual delineamento é mais adequado?",[["Estudo transversal.",1,"Observa os pacientes em um período e compara métodos. Para acompanhar a evolução dos sintomas, a coorte seria mais adequada."],["Estudo caso-controle.",.4,"Compararia pacientes com e sem diagnóstico confirmado: válido para outra pergunta, mas não para comparar métodos."],["Ensaio clínico.",.1,"Exigiria intervenção atribuída pelo pesquisador."]],1)]},
{t:"População e amostra",ic:"👥",i:"População-alvo: grupo ao qual queremos generalizar. População acessível: a parte a que temos acesso. Amostra: subconjunto estudado. Probabilística (aleatória simples, sistemática, estratificada) ou não probabilística (conveniência). Critérios de inclusão e exclusão delimitam quem participa.",q:[
Q("População","Qual população e amostra são mais adequadas?",[["População: pacientes com suspeita de dengue atendidos no laboratório; amostra: pacientes do período, com amostras coletadas e testadas pelos métodos.",1,"A amostra faz parte da população acessível e se relaciona ao problema."],["Somente pacientes com teste rápido positivo.",0,"Exclui os falsos negativos, o que impede avaliar o desempenho."],["Pacientes com dengue confirmada por RT-PCR.",.3,"Excluir os não confirmados impede estimar o desempenho dos métodos (por exemplo, a especificidade)."]]),
Q("Amostragem","Qual estratégia de amostragem é mais adequada?",[["Estratificada por dias de sintomas (por exemplo, até 5 dias, e mais de 5 dias).",1,"Garante representantes de cada fase, essencial para a pergunta."],["Conveniência: os primeiros pacientes que chegarem.",.4,"Prática, mas pode super-representar certas fases e limita a generalização."],["Escolher os casos mais interessantes.",0,"Viés de seleção."]]),
Q("Critérios de inclusão e exclusão","Quais critérios são adequados?",[["Incluir: pacientes sintomáticos com os testes realizados e TCLE. Excluir: amostras insuficientes ou com dados essenciais ausentes.",1,"Delimitam claramente e protegem a qualidade dos dados."],["Incluir qualquer paciente; sem critérios de exclusão.",0,"A heterogeneidade prejudica a análise."],["Excluir pacientes com resultados discordantes.",0,"Excluir justamente o fenômeno estudado é viés grave."]])]},
{t:"Variáveis",ic:"📊",i:"Qualitativas: categorias. Quantitativas: números. Independente (explicativa): o que se supõe influenciar; dependente (desfecho): o que se mede como resposta.",q:[
Q("Variáveis","Classifique ‘dias desde o início dos sintomas’.",[["Quantitativa; independente.",1,"Numérica, e se supõe que influencie o desempenho do teste."],["Qualitativa; dependente.",0,"Dias são numéricos, e não o desfecho."],["Quantitativa; dependente.",.3,"Quantitativa, sim, mas o desfecho aqui é o resultado dos testes."]]),

function sc(i){const a=S.a[i]||{};return Math.min(100,Object.values(a).reduce((x,y)=>x+(y.p||0),0))}
function draw(){if(!S.c)return home();if(S.s>5)return fim();step()}
function home(){$(`<div class="card"><p>Você foi convidado a integrar uma equipe de pesquisa científica. Sua missão será investigar um problema real da área da saúde, tomar decisões metodológicas e construir uma proposta de pesquisa cientificamente coerente.</p><p><b>Cada escolha terá consequências. Você precisará pensar como um pesquisador!</b></p></div><div class="g"><button class="c ${S.p=="fisio"?"on":""}" onclick="S.p='fisio';draw()"><span>🦵</span><b>FISIOTERAPIA</b><br>Desafio: recuperação da capacidade funcional em pacientes idosos após internação hospitalar.</button><button class="c ${S.p=="bio"?"on":""}" onclick="S.p='bio';draw()"><span>🧪</span><b>BIOMEDICINA</b><br>Desafio: avaliação do desempenho de métodos laboratoriais no diagnóstico da dengue.</button></div><div class="nav"><span></span><button class="btn" ${S.p?"":"disabled"} onclick="S.c=S.p;draw()">Começar desafio ▶</button></div>`)}
function pick(s,i,j){const st=D[S.c].st[s],q=st.q[i],a=S.a[s]=S.a[s]||{},t=a[i]?a[i].t:0,w=q.o[j][1];a[i]={j,w,t,p:Math.round(w*(100/st.q.length)*(t?.6:1)),jt:a[i]?a[i].jt:""};draw()}
function retry(s,i){S.a[s][i]={j:null,t:S.a[s][i].t+1,p:0,jt:S.a[s][i].jt};draw()}
function ord(s,i,q){S.ord=S.ord||{};const k=s+'_'+i;if(!S.ord[k]){const a=q.o.map((_,x)=>x);for(let x=a.length-1;x>0;x--){const y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]]}if(q.o[a[0]][1]==1){const y=1+Math.floor(Math.random()*(a.length-1));[a[0],a[y]]=[a[y],a[0]]}S.ord[k]=a}return S.ord[k]}
function step(){const s=S.s,st=D[S.c].st[s],a=S.a[s]||{};const ok=st.q.every((_,i)=>a[i]&&a[i].j!=null);
let h=`<div class="top"><b>${D[S.c].n}</b><span>Etapa ${s+1} de 6 · Pontos: ${total()} / 600</span></div><div class="bar"><i style="width:${Math.round(s/6*100+(ok?100/6:0))}%"></i></div><div class="dots">${D[S.c].st.map((x,i)=>`<span class="${i==s?"a":i<s?"d":""}" title="${x.t}">${x.ic}</span>`).join("")}</div><div class="card intro"><h2>${st.ic} Etapa ${s+1} – ${st.t}</h2><p>${st.i}</p></div>`;
st.q.forEach((q,i)=>{const r=a[i],d=r&&r.j!=null;h+=`<div class="card"><h3>${q.t}</h3>`+ord(s,i,q).map(j=>`<button class="o ${d&&r.j==j?"sel":""}" ${d?"disabled":""} onclick="pick(${s},${i},${j})">${q.o[j][0]}</button>`).join("");
if(d){const o=q.o[r.j],g=r.w==1;h+=`<div class="fb ${g?"ok":"no"}"><b>${g?"✔ Adequada":r.w>0?"◐ Parcialmente adequada":"✖ Inadequada"}</b> (+${r.p} pts)<p>${o[2]}</p></div>`;if(!g)h+=`<button class="btn s" style="margin-top:8px" onclick="retry(${s},${i})">↻ Revisar e tentar novamente</button>`;if(q.j)h+=`<textarea rows="2" placeholder="Justifique sua escolha…" oninput="S.a[${s}][${i}].jt=this.value">${r.jt||""}</textarea>`}
h+="</div>"});
h+=`<div class="nav"><button class="btn s" onclick="${s?"S.s--;draw();scrollTo(0,0)":"S.c=null;draw()"}">◀ Voltar</button><button class="btn" ${ok?"":"disabled"} onclick="S.s++;draw();scrollTo(0,0)">${s==5?"Ver relatório final":"Próxima etapa"} ▶</button></div>`;$(h)}
function fim(){const C=D[S.c],T=total(),L=["Pesquisador iniciante","Pesquisador em desenvolvimento","Pesquisador estratégico","Pesquisador científico"][T>=540?3:T>=420?2:T>=300?1:0];
const g=(k)=>{const r=[];C.st.forEach((st,s)=>st.q.forEach((q,i)=>{if(q.k==k){const a=(S.a[s]||{})[i];if(a)r.push(q.o[a.j][0]+(a.jt?" — Justificativa: "+a.jt:""))}}));return r.join("<br><br>")||"—"};
const ks=[["Problema de pesquisa","Problema de pesquisa"],["Pergunta de pesquisa","Pergunta de pesquisa"],["Objetivo geral","Objetivo geral"],["Classificação da pesquisa","Classificação"],["Delineamento","Delineamento"],["População e amostra","População"],["Amostragem","Amostragem"],["Critérios de inclusão/exclusão","Critérios de inclusão e exclusão"],["Variáveis","Variáveis"],["Instrumentos e métodos de coleta","Instrumentos"],["Cuidados éticos e de integridade","Ética e integridade"]];
const dom=[],rev=[];C.st.forEach((st,s)=>st.q.forEach((q,i)=>{const a=(S.a[s]||{})[i];(a&&a.w==1&&a.t==0?dom:rev).push(st.t+": "+q.k)}));
const coer=T>=540?"A proposta é metodologicamente coerente: problema, pergunta, objetivo, delineamento, amostra, variáveis e instrumentos estão alinhados.":T>=420?"A proposta é, em geral, coerente, mas há pontos a ajustar para um melhor alinhamento entre pergunta, delineamento e coleta.":T>=300?"A proposta tem lacunas de coerência: revise a relação entre pergunta, delineamento, amostra e instrumentos.":"A proposta precisa ser reestruturada: retome os conceitos das etapas e refaça as decisões.";
$(`<div class="card" style="text-align:center"><div>Pontuação total</div><div class="big">${T} / 600</div><h2>🏅 ${L}</h2><p>${T>=420?"Excelente trabalho! Você pensou como um pesquisador.":"Bom caminho! Errar faz parte do método científico. Revise os pontos abaixo e tente de novo."}</p><small>A classificação é lúdica e não substitui a avaliação acadêmica formal.</small></div>
<div class="card"><h3>Desempenho por etapa</h3>${C.st.map((st,i)=>`<div style="margin:8px 0">${st.ic} ${st.t}: <b>${sc(i)}</b>/100<div class="bar"><i style="width:${sc(i)}%"></i></div></div>`).join("")}</div>
<div class="card"><h3>✔ Conceitos dominados</h3><p>${dom.join(" · ")||"Ainda nenhum na primeira tentativa. Tente novamente!"}</p><h3>↻ Para revisar</h3><p>${rev.join(" · ")||"Nada: parabéns!"}</p></div>
<div class="card"><h2>📄 Relatório: ${C.n}</h2><table>${ks.map(k=>`<tr><td>${k[0]}</td><td>${g(k[1])}</td></tr>`).join("")}</table><p><b>Coerência metodológica:</b> ${coer}</p></div>
<div class="nav np"><button class="btn s" onclick="S.s=5;draw()">◀ Revisar decisões</button><span><button class="btn s" onclick="print()">🖨 Imprimir / salvar PDF</button> <button class="btn" onclick="go({c:null,s:0,a:{}})">Reiniciar</button></span></div>`)}
draw();
</script></body></html>
